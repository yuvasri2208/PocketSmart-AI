<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - PocketSmart</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <header class="navbar">
    <a href="/" class="brand">PocketSmart</a>
    <div class="nav-links">
      <a href="/login">Sign In</a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">
    <div class="card" style="max-width: 440px; width: 100%;">
      <div class="card-header" style="text-align:center; background:#fff; border-bottom:none; padding-top:2rem;">
        <h2 style="font-size:1.5rem; color:#1e293b;">Create Your Account</h2>
      </div>
      <div class="card-body">
        <form id="regForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" class="form-control" required placeholder="Choose a username">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" required placeholder="Create a strong password">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="cpassword" class="form-control" required placeholder="Confirm password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Create Account 👤+</button>
        </form>
        <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:1.5rem;">
          Already have an account? <a href="/login" style="color:var(--accent); font-weight:600;">Sign In</a>
        </p>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const em = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      const cp = document.getElementById('cpassword').value;
      if (p !== cp) {
        alert("Passwords do not match");
        return;
      }
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, email: em, password: p })
      });
      if (res.ok) {
        alert("Account created! Please sign in.");
        window.location.href = '/login';
      } else {
        const d = await res.json();
        alert(d.detail || "Error registering");
      }
    };
  </script>
</body>
</html>
